name: AFJG PR Certification

on:
  pull_request:
  push:
    branches: [main]

jobs:
  certification:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest hypothesis
          python -m pip install jsonschema==4.25.1
          python -m pip install -e .

      - name: Run CFK regression subset (contract gate)
        run: |
          PYTHONPATH=src:. python -m pytest -q \
            tests/test_cfk_kernel.py \
            tests/test_cfk_pipeline.py \
            tests/test_cfk_schema.py \
            tests/test_cfk_transforms.py \
            tests/test_cfk_reverse_trace.py \
            tests/test_cfk_cross_layer_conservation.py \
            tests/test_cfk_no_silent_fallback.py \
            tests/test_cfk_integration_contract.py \
            tests/test_public_judgment_contract.py

      - name: Run AFJG merge governance tests
        run: |
          PYTHONPATH=src:. python -m pytest -q \
            tests/test_coding_checks_governance.py \
            tests/test_coding_pr_audit.py \
            tests/test_coding_real_pr_fixtures.py \
            tests/test_coding_merge_governance.py \
            tests/test_coding_pr_certification.py \
            tests/test_nabhani_mind_worktree.py \
            tests/test_public_judgment_contract.py \
            tests/test_cross_runtime_governance_consistency.py \
            tests/test_certificate_pipeline_integrity.py \
            tests/test_api_hardening.py \
            tests/test_runtime_concurrency.py \
            tests/test_replay_consistency.py

      - name: Run full regression suite
        run: |
          PYTHONPATH=src:. python -m pytest -q
