name: AFJG PR Certification

on:
  pull_request:
  push:
    branches: [main]

jobs:
  certification:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .

      - name: Run AFJG merge governance tests
        run: |
          PYTHONPATH=src python -m pytest -q \
            tests/test_coding_checks_governance.py \
            tests/test_coding_pr_audit.py \
            tests/test_coding_real_pr_fixtures.py \
            tests/test_coding_merge_governance.py \
            tests/test_coding_pr_certification.py
