name: Formal Theorem Track

on:
  pull_request:
  push:
    branches: [main]

jobs:
  formal-theorem-track:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .

      - name: Verify formal scaffolding artifacts
        run: |
          test -f research/formal/theorem_scaffolding.json
          test -f research/formal/theorem_obligations.json
          test -f research/formal/proof_mapping.json
          test -f research/formal/lean/README.md
          test -f research/formal/lean/CoreJudgment.lean
          test -f research/formal/lean/NoIllicitCertification.lean
          test -f research/formal/lean/TriadClosure.lean
          test -f research/formal/coq/README.md

      - name: Attempt Lean machine-check for minimal core (if available)
        run: |
          if command -v lean >/dev/null 2>&1; then
            echo "Lean detected; running machine-check for minimal core."
            lean --version
            lean research/formal/lean/CoreJudgment.lean
            lean research/formal/lean/NoIllicitCertification.lean
            lean research/formal/lean/TriadClosure.lean
          else
            echo "Lean not available; running fallback theorem-contract checks only."
            python - <<'PY'
            from pathlib import Path
            required = {
                "CoreJudgment.lean": ["inductive PublicJudgment", "def certificateAllowed", "def publicJudgment"],
                "NoIllicitCertification.lean": [
                    "theorem no_illicit_certification",
                    "theorem missing_gate_blocks_certificate",
                    "theorem forbidden_transition_blocks_certificate",
                    "theorem residual_erasure_blocks_certificate",
                ],
                "TriadClosure.lean": ["theorem triad_closure"],
            }
            base = Path("research/formal/lean")
            for file_name, tokens in required.items():
                text = (base / file_name).read_text(encoding="utf-8")
                assert "sorry" not in text
                for token in tokens:
                    assert token in text, f"missing token {token} in {file_name}"
            print("Lean fallback contract checks passed.")
            PY
          fi

      - name: Run formal theorem track tests
        run: |
          PYTHONPATH=src python -m pytest -q \
            tests/test_formal_theorem_scaffolding.py \
            tests/test_formal_scientific_validation_baseline.py \
            tests/test_formal_theorem_track.py
