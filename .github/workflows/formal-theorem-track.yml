name: Formal Theorem Track

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

on:
  pull_request:
    paths:
      - "research/formal/**"
      - "tests/test_formal_*.py"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/formal-theorem-track.yml"
  push:
    branches: [main]
    paths:
      - "research/formal/**"
      - "tests/test_formal_*.py"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/formal-theorem-track.yml"
  workflow_dispatch:

jobs:
  formal-theorem-track:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project and test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .

      - name: Verify formal scaffolding artifacts
        run: |
          test -f research/formal/theorem_scaffolding.json
          test -f research/formal/theorem_obligations.json
          test -f research/formal/proof_mapping.json
          test -f research/formal/lean/README.md
          test -f research/formal/lean/CoreJudgment.lean
          test -f research/formal/lean/NoIllicitCertification.lean
          test -f research/formal/lean/TriadClosure.lean
          test -f research/formal/lean/RankSoundness.lean
          test -f research/formal/lean/TypedResiduals.lean
          test -f research/formal/lean/ResidualCalculus.lean
          test -f research/formal/coq/README.md
          set -euo pipefail
          required_files=(
            research/formal/theorem_scaffolding.json
            research/formal/theorem_obligations.json
            research/formal/proof_mapping.json
            research/formal/lean/README.md
            research/formal/lean/CoreJudgment.lean
            research/formal/lean/NoIllicitCertification.lean
            research/formal/lean/TriadClosure.lean
            research/formal/coq/README.md
          )
          missing=0
          for f in "${required_files[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "::error file=$f::required formal artifact missing"
              missing=1
            fi
          done
          exit "$missing"

      - name: Attempt Lean machine-check for theorem core (if available)
        run: |
          set -euo pipefail
          if command -v lean >/dev/null 2>&1; then
            echo "Lean detected; running machine-check for theorem core."
            lean --version
            cd research/formal/lean
            lean CoreJudgment.lean
            lean NoIllicitCertification.lean
            lean TriadClosure.lean
            lean RankSoundness.lean
            lean TypedResiduals.lean
            lean ResidualCalculus.lean
          else
            echo "Lean not available; running fallback theorem-contract checks only."
            python research/formal/lean/scripts/contract_check.py
          fi

      - name: Run formal theorem track tests
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_formal_theorem_scaffolding.py \
            tests/test_formal_scientific_validation_baseline.py \
            tests/test_formal_theorem_track.py \
            tests/test_formal_rank_soundness_track.py \
            tests/test_formal_residual_calculus_track.py
