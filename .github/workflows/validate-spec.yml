name: Validate Bayani Spec

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Install validation dependencies
        run: python -m pip install jsonschema==4.25.1

      - name: Validate schema, spec, and prompt invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema

          root = Path.cwd()
          schema = json.loads((root / 'schema/bayani-knowledge-system.schema.json').read_text(encoding='utf-8'))
          spec = json.loads((root / 'spec/bayani-knowledge-system.json').read_text(encoding='utf-8'))
          prompt_path = root / 'docs/prompts/nabhani-mustadil-readiness.prompt.md'

          jsonschema.Draft202012Validator.check_schema(schema)
          jsonschema.validate(spec, schema)

          assert prompt_path.exists(), 'Missing Mustadil readiness prompt document'

          layer = spec['mustadil_readiness_layer']
          assert layer['allowed_outputs'] == ['Certificate', 'Hypothesis', 'Zero']
          assert layer['output_contract']['state_enum'] == ['Certificate', 'Hypothesis', 'Zero']
          assert len(layer['readiness_checks']) == 12
          assert {gate['name'] for gate in layer['mathematical_evaluation_layer']} == {
              'GapDetector', 'LeapDetector', 'TraceValidator', 'ProofRankChecker',
              'ZeroGuard', 'FailurePredictor', 'ReliabilityScorer'
          }
          assert all(test['expected_state'] in {'Certificate', 'Hypothesis', 'Zero'} for test in layer['spec_tests'])
          assert any('Certificate بلا ProofObject valid' in item for item in layer['acceptance_criteria'])
          assert any('blocking_zero' in item for item in layer['acceptance_criteria'])
          PY
